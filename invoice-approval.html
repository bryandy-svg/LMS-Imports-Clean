<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Inventory Approval</title>
  <style>
    :root {
      --bg: #f5f7f4;
      --panel: #fff;
      --ink: #172018;
      --muted: #637064;
      --line: #d7ded7;
      --green: #2d7657;
      --danger: #b42318;
      --blue: #245dbb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 20px; }
    main {
      display: grid;
      gap: 14px;
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, input, select {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    button {
      font-weight: 800;
      cursor: pointer;
    }
    button.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    button.danger {
      color: var(--danger);
      border-color: #f0beb8;
    }
    .muted { color: var(--muted); }
    .status {
      padding: 10px 12px;
      border-radius: 7px;
      background: #eef5ef;
      color: #24513c;
    }
    .status.error {
      background: #fff0ee;
      color: var(--danger);
    }
    .review {
      display: grid;
      gap: 10px;
    }
    .row {
      display: grid;
      grid-template-columns: 82px 70px minmax(220px, 2fr) minmax(120px, 1fr) 82px 90px 110px minmax(130px, 1fr) minmax(130px, 1fr) minmax(120px, 1fr) minmax(110px, 1fr) 72px;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .head {
      color: #59665a;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      background: #f9fbf9;
    }
    .photo {
      width: 72px;
      height: 72px;
      border: 1px solid var(--line);
      border-radius: 7px;
      object-fit: cover;
      background: #edf2ed;
    }
    .placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
    }
    .photo-cell {
      display: grid;
      gap: 6px;
    }
    .photo-cell input {
      width: 72px;
      min-height: 30px;
      padding: 4px;
      font-size: 11px;
    }
    .use-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
    }
    .use-cell input {
      width: 18px;
      min-height: 18px;
    }
    @media (max-width: 920px) {
      header { align-items: flex-start; flex-direction: column; }
      .row {
        grid-template-columns: 82px 1fr;
      }
      .head { display: none; }
      .row > *::before {
        display: block;
        margin-bottom: 3px;
        color: #59665a;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .use-cell::before { content: "Use"; }
      .name-cell::before { content: "Item"; }
      .sku-cell::before { content: "SKU"; }
      .qty-cell::before { content: "Qty"; }
      .unit-cell::before { content: "Unit"; }
      .cost-cell::before { content: "Unit Cost"; }
      .vendor-cell::before { content: "Vendor"; }
      .invoice-cell::before { content: "Invoice #"; }
      .location-cell::before { content: "Location"; }
      .bin-cell::before { content: "Bin"; }
      .delete-cell::before { content: "Delete"; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Invoice Approval</h1>
      <div class="muted">Review imported invoice items, add photos, then approve into inventory.</div>
    </div>
    <div class="toolbar">
      <select id="statusFilter" title="Invoice draft status">
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="All">All</option>
      </select>
      <select id="draftSelect" title="Pending invoice uploads"></select>
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="addRowBtn" type="button">Add Row</button>
      <button id="saveDraftBtn" type="button">Save Draft</button>
      <button class="primary" id="approveBtn" type="button">Approve Add To Inventory</button>
    </div>
  </header>

  <main>
    <div class="status" id="status">Loading pending invoice draft...</div>
    <section class="panel review">
      <div class="row head">
        <div>Photo</div>
        <div>Use</div>
        <div>Item Name</div>
        <div>SKU</div>
        <div>Qty</div>
        <div>Unit</div>
        <div>Unit Cost</div>
        <div>Vendor</div>
        <div>Invoice #</div>
        <div>Location</div>
        <div>Bin</div>
        <div>Delete</div>
      </div>
      <div class="review" id="rows"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://laufwbeinkvlwdhroeaj.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhdWZ3YmVpbmt2bHdkaHJvZWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MjE0NTksImV4cCI6MjA5NDk5NzQ1OX0.Jm3ivkmxnak2j9uX1n9b1e0cVuT5QlH2U8CLHoZWKqg";
    const itemTable = "inventory_items";
    const requestTable = "inventory_requests";
    const adminPassword = "Landscape1";
    const client = createClient(supabaseUrl, supabaseKey);
    const $ = id => document.getElementById(id);
    const query = new URLSearchParams(location.search);

    let drafts = [];
    let activeDraftId = query.get("draft") || "";
    let rows = [];
    let items = [];

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function setStatus(message, error = false) {
      $("status").textContent = message;
      $("status").classList.toggle("error", error);
    }

    function normalizeStockLocations(item = {}) {
      const source = Array.isArray(item.stockLocations) ? item.stockLocations : [];
      const clean = source.map(row => ({
        id: row.id || crypto.randomUUID(),
        location: String(row.location || "").trim(),
        bin: String(row.bin || "").trim(),
        quantity: Number(row.quantity || 0),
        notes: String(row.notes || "").trim(),
        receivedDate: row.receivedDate || "",
        createdAt: row.createdAt || "",
        updatedAt: row.updatedAt || ""
      })).filter(row => row.location || row.bin || row.quantity > 0);
      if (!clean.length && (item.location || item.bin || Number(item.quantity || 0) > 0)) {
        clean.push({ id: crypto.randomUUID(), location: item.location || "Main", bin: item.bin || "", quantity: Number(item.quantity || 0), notes: "", receivedDate: item.receivedDate || "", createdAt: item.createdAt || "", updatedAt: item.updatedAt || "" });
      }
      return clean;
    }

    function stockLocationTotal(item = {}) {
      return normalizeStockLocations(item).reduce((sum, row) => sum + Number(row.quantity || 0), 0);
    }

    function adjustStockLocationByName(item, locationName, binName, amount) {
      item.stockLocations = normalizeStockLocations(item);
      const cleanLocation = String(locationName || "").trim() || item.location || "Main";
      const cleanBin = String(binName || "").trim();
      let stockRow = item.stockLocations.find(location =>
        String(location.location || "").trim().toLowerCase() === cleanLocation.toLowerCase()
        && String(location.bin || "").trim().toLowerCase() === cleanBin.toLowerCase()
      );
      if (!stockRow) {
        stockRow = { id: crypto.randomUUID(), location: cleanLocation, bin: cleanBin, quantity: 0, notes: "", receivedDate: new Date().toISOString().slice(0, 10), createdAt: new Date().toISOString() };
        item.stockLocations.push(stockRow);
      }
      stockRow.quantity = Math.max(0, Number(stockRow.quantity || 0) + Number(amount));
      stockRow.updatedAt = new Date().toISOString();
      item.quantity = stockLocationTotal(item);
      item.location = item.stockLocations.map(location => location.location).filter(Boolean)[0] || item.location || "";
      item.bin = item.stockLocations.map(location => location.bin).filter(Boolean)[0] || item.bin || "";
      return stockRow;
    }

    async function loadItems() {
      const { data, error } = await client.from(itemTable).select("payload");
      if (error) throw error;
      items = (data || []).map(row => row.payload).filter(Boolean);
    }

    async function loadDrafts() {
      setStatus("Loading pending invoice uploads...");
      const { data, error } = await client.from(requestTable).select("payload").order("updated_at", { ascending: false });
      if (error) {
        setStatus(error.message, true);
        return;
      }
      const statusFilter = $("statusFilter").value || "Pending";
      drafts = (data || [])
        .map(row => row.payload)
        .filter(payload => payload?.recordType === "invoice_import")
        .filter(payload => statusFilter === "All" || (payload.status || "Pending") === statusFilter);
      if (!drafts.length) {
        $("draftSelect").innerHTML = `<option value="">No pending uploads</option>`;
        rows = [];
        renderRows();
        setStatus(`No ${statusFilter.toLowerCase()} invoice uploads found.`);
        return;
      }
      activeDraftId = activeDraftId && drafts.some(draft => draft.id === activeDraftId) ? activeDraftId : drafts[0].id;
      $("draftSelect").innerHTML = drafts.map((draft, index) => {
        const rowCount = (draft.rows || []).length;
        const date = new Date(draft.updatedAt || draft.createdAt || Date.now()).toLocaleString();
        return `<option value="${escapeHtml(draft.id)}">${escapeHtml(draft.status || "Pending")} ${index + 1} - ${date} - ${rowCount} item${rowCount === 1 ? "" : "s"}</option>`;
      }).join("");
      $("draftSelect").value = activeDraftId;
      loadActiveDraft();
      setStatus(`${drafts.length} ${statusFilter.toLowerCase()} invoice upload${drafts.length === 1 ? "" : "s"} loaded.`);
    }

    function loadActiveDraft() {
      const draft = drafts.find(record => record.id === activeDraftId);
      rows = (draft?.rows || []).map(row => ({ use: row.use !== false, photoData: row.photoData || "", ...row }));
      renderRows();
    }

    function renderRows() {
      $("rows").innerHTML = rows.map((row, index) => `
        <div class="row" data-row="${index}">
          <div class="photo-cell">
            ${row.photoData ? `<img class="photo" src="${row.photoData}" alt="Item photo">` : `<div class="photo placeholder">IMG</div>`}
            <button type="button" data-camera="${index}">Use Camera</button>
            <input type="file" accept="image/*" capture="environment" data-photo="${index}">
          </div>
          <label class="use-cell"><input type="checkbox" data-use ${row.use === false ? "" : "checked"}>Use</label>
          <input class="name-cell" data-name value="${escapeHtml(row.name || "")}" placeholder="Item name">
          <input class="sku-cell" data-sku value="${escapeHtml(row.sku || "")}" placeholder="SKU">
          <input class="qty-cell" data-qty type="number" min="0" step="1" value="${Number(row.quantity || 1)}">
          <input class="unit-cell" data-unit value="${escapeHtml(row.unit || "each")}">
          <input class="cost-cell" data-cost type="number" min="0" step="0.01" value="${Number(row.unitCost || 0)}">
          <input class="vendor-cell" data-vendor value="${escapeHtml(row.vendor || "")}" placeholder="Vendor">
          <input class="invoice-cell" data-invoice value="${escapeHtml(row.invoiceNumber || row.invoiceNo || "")}" placeholder="Invoice #">
          <input class="location-cell" data-location value="${escapeHtml(row.location || "Mall Lot")}">
          <input class="bin-cell" data-bin value="${escapeHtml(row.bin || "")}">
          <button class="danger delete-cell" type="button" data-delete-row="${index}">Delete</button>
        </div>
      `).join("") || `<div class="muted">No draft rows loaded.</div>`;
    }

    function collectRows() {
      return [...document.querySelectorAll("[data-row]")].map((row, index) => ({
        ...rows[index],
        use: row.querySelector("[data-use]").checked,
        name: row.querySelector("[data-name]").value.trim(),
        sku: row.querySelector("[data-sku]").value.trim(),
        quantity: Number(row.querySelector("[data-qty]").value || 0),
        unit: row.querySelector("[data-unit]").value.trim() || "each",
        unitCost: Number(row.querySelector("[data-cost]").value || 0),
        vendor: row.querySelector("[data-vendor]").value.trim(),
        invoiceNumber: row.querySelector("[data-invoice]").value.trim(),
        location: row.querySelector("[data-location]").value.trim() || "Mall Lot",
        bin: row.querySelector("[data-bin]").value.trim()
      }));
    }

    function compressImage(file, callback) {
      if (!file.type.startsWith("image/")) {
        setStatus("Please choose an image file.", true);
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const maxSide = 700;
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL("image/jpeg", 0.55));
        };
        image.onerror = () => setStatus("Could not read that photo. Please try another image.", true);
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveDraft(message = "Draft saved online.") {
      if (!activeDraftId) {
        setStatus("No invoice upload selected.", true);
        return false;
      }
      rows = collectRows();
      const draft = drafts.find(record => record.id === activeDraftId) || { id: activeDraftId, recordType: "invoice_import" };
      draft.status = draft.status || "Pending";
      draft.rows = rows;
      draft.updatedAt = new Date().toISOString();
      const { error } = await client.from(requestTable).upsert({
        id: activeDraftId,
        request_type: "Invoice Import",
        status: draft.status,
        item_name: "Invoice import draft",
        payload: draft,
        updated_at: draft.updatedAt
      }, { onConflict: "id" });
      if (error) {
        setStatus(error.message, true);
        return false;
      }
      setStatus(message);
      return true;
    }

    function itemRecord(item) {
      return {
        id: item.id,
        payload: item,
        sku: item.sku,
        name: item.name,
        quantity: item.quantity,
        po_number: item.poNumber,
        source_from: item.sourceFrom,
        updated_at: item.updatedAt
      };
    }

    async function approveRows() {
      rows = collectRows();
      const approvedRows = rows.filter(row => row.use && row.name && Number(row.quantity || 0) > 0);
      if (!approvedRows.length) {
        setStatus("No approved rows are ready to add.", true);
        return;
      }
      setStatus("Approving invoice rows...");
      try {
        await loadItems();
        const changed = [];
        approvedRows.forEach(row => {
          let item = items.find(record => row.sku && String(record.sku || "").toLowerCase() === row.sku.toLowerCase())
            || items.find(record => String(record.name || "").toLowerCase() === row.name.toLowerCase());
          if (!item) {
            item = {
              id: crypto.randomUUID(),
              name: row.name,
              sku: row.sku,
              barcode: "",
              category: "General",
              quantity: 0,
              unit: row.unit,
              reorderPoint: 0,
              targetStock: row.quantity,
              unitCost: row.unitCost,
              sellPrice: 0,
              location: row.location,
              bin: row.bin,
              supplier: row.vendor || "",
              supplierContact: "",
              poNumber: row.invoiceNumber || "",
              sourceFrom: row.vendor ? `Invoice import - ${row.vendor}` : "Invoice import",
              owner: "",
              status: "Active",
              photoData: row.photoData || "",
              stockLocations: [],
              movements: [],
              createdAt: new Date().toISOString()
            };
            items.unshift(item);
          }
          if (row.vendor) item.supplier = row.vendor;
          if (row.invoiceNumber) item.poNumber = row.invoiceNumber;
          item.sourceFrom = [row.vendor || "Invoice import", row.invoiceNumber ? `Invoice ${row.invoiceNumber}` : ""].filter(Boolean).join(" - ");
          if (row.photoData) item.photoData = row.photoData;
          item.unit = row.unit || item.unit || "each";
          item.unitCost = row.unitCost || item.unitCost || 0;
          const stockRow = adjustStockLocationByName(item, row.location, row.bin, row.quantity);
          item.updatedAt = new Date().toISOString();
          item.movements ||= [];
          item.movements.push({ amount: row.quantity, reason: `Added from approved invoice PDF${row.invoiceNumber ? ` ${row.invoiceNumber}` : ""}${row.vendor ? ` from ${row.vendor}` : ""}`, location: [stockRow.location, stockRow.bin].filter(Boolean).join(" / "), date: new Date().toISOString() });
          changed.push(itemRecord(item));
        });
        const { error } = await client.from(itemTable).upsert(changed, { onConflict: "id" });
        if (error) throw error;
        const draft = drafts.find(record => record.id === activeDraftId) || { id: activeDraftId, recordType: "invoice_import" };
        draft.status = "Approved";
        draft.rows = rows;
        draft.updatedAt = new Date().toISOString();
        await client.from(requestTable).upsert({
          id: activeDraftId,
          request_type: "Invoice Import",
          status: "Approved",
          item_name: "Invoice import draft",
          payload: draft,
          updated_at: draft.updatedAt
        }, { onConflict: "id" });
        setStatus(`Approved ${approvedRows.length} row${approvedRows.length === 1 ? "" : "s"} into inventory.`);
        await loadDrafts();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    $("refreshBtn").addEventListener("click", loadDrafts);
    $("statusFilter").addEventListener("change", () => {
      activeDraftId = "";
      loadDrafts();
    });
    $("draftSelect").addEventListener("change", event => {
      activeDraftId = event.target.value;
      loadActiveDraft();
      setStatus("Invoice upload loaded.");
    });
    $("addRowBtn").addEventListener("click", () => {
      rows = collectRows();
      rows.push({ use: true, name: "", sku: "", quantity: 1, unit: "each", unitCost: 0, vendor: "", invoiceNumber: "", location: "Mall Lot", bin: "", photoData: "" });
      renderRows();
    });
    $("saveDraftBtn").addEventListener("click", () => saveDraft());
    $("approveBtn").addEventListener("click", approveRows);
    $("rows").addEventListener("change", event => {
      const input = event.target.closest("[data-photo]");
      if (!input?.files?.[0]) return;
      const index = Number(input.dataset.photo);
      rows = collectRows();
      compressImage(input.files[0], data => {
        rows[index].photoData = data;
        renderRows();
        saveDraft("Photo attached and saved online.");
      });
    });
    $("rows").addEventListener("click", event => {
      const button = event.target.closest("[data-camera]");
      if (!button) return;
      const input = document.querySelector(`[data-photo="${button.dataset.camera}"]`);
      input?.click();
    });
    $("rows").addEventListener("click", event => {
      const button = event.target.closest("[data-delete-row]");
      if (!button) return;
      rows = collectRows();
      rows.splice(Number(button.dataset.deleteRow), 1);
      renderRows();
      saveDraft("Line deleted and draft saved online.");
    });

    const password = prompt("Enter Admin Password");
    if (password === adminPassword) {
      loadDrafts();
    } else {
      setStatus("Incorrect admin password.", true);
      document.querySelectorAll("button, input, select").forEach(control => control.disabled = true);
    }
  </script>
</body>
</html>
