<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure PDF Download</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6f8;color:#102033;font-family:Arial,Helvetica,sans-serif;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #d7e0e6;border-radius:14px;box-shadow:0 18px 48px rgba(16,32,51,.15);padding:28px}.brand{color:#075f6d;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase}h1{font-size:24px;margin:14px 0 8px}.note{color:#526477;line-height:1.5;margin:0 0 24px}.actions{display:flex;justify-content:flex-end;gap:10px}button{border:1px solid #cbd6de;border-radius:8px;background:#fff;color:#102033;font:inherit;font-weight:700;padding:11px 18px;cursor:pointer}.primary{background:#496975;border-color:#496975;color:#fff}.error{color:#9d2f2f;background:#fff2f0;border:1px solid #f0c9c3;padding:12px;border-radius:8px;margin-top:16px;display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">LMS Imports</div>
    <h1 id="downloadLabel">Download PDF</h1>
    <p class="note">This secure link downloads only the document shown above. No LMS login is required.</p>
    <div class="actions">
      <button id="cancelButton" type="button">Cancel</button>
      <button id="downloadButton" class="primary" type="button">OK — Download PDF</button>
    </div>
    <div id="errorMessage" class="error"></div>
  </main>
  <script>
    const parameters = new URLSearchParams(location.hash.slice(1));
    const signedUrl = parameters.get("url") || "";
    const label = parameters.get("label") || "Download PDF";
    const fileName = parameters.get("file") || "document.pdf";
    document.title = label;
    document.getElementById("downloadLabel").textContent = label;
    document.getElementById("downloadButton").addEventListener("click", () => {
      if (!signedUrl || !/^https:\/\//i.test(signedUrl)) {
        const error = document.getElementById("errorMessage");
        error.textContent = "This download link is incomplete or has expired. Please request a new email link.";
        error.style.display = "block";
        return;
      }
      const anchor = document.createElement("a");
      anchor.href = signedUrl;
      anchor.download = fileName;
      anchor.rel = "noopener";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });
    document.getElementById("cancelButton").addEventListener("click", () => {
      window.close();
      if (!window.closed) history.length > 1 ? history.back() : location.replace("about:blank");
    });
  </script>
</body>
</html>
