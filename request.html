<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mall Lot Inventory Request</title>
  <style>
    :root {
      --bg: #f5f7f4;
      --panel: #fff;
      --ink: #172018;
      --muted: #637064;
      --line: #d7ded7;
      --green: #2d7657;
      --blue: #245dbb;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 15px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 20px; }
    main {
      display: grid;
      gap: 12px;
      padding: 12px;
      max-width: 720px;
      margin: 0 auto;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    label {
      display: grid;
      gap: 5px;
      color: #59665a;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    input, select, textarea, button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    button {
      border-color: #cfd8d0;
      font-weight: 800;
      cursor: pointer;
    }
    button.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    button.danger {
      color: var(--danger);
      border-color: #f0beb8;
    }
    .grid { display: grid; gap: 10px; }
    .row {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .row img, .placeholder {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #edf2ed;
    }
    .placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
    }
    .row strong { display: block; margin-bottom: 3px; }
    .muted { color: var(--muted); font-size: 12px; text-transform: none; font-weight: 400; }
    .selected-item {
      grid-template-columns: 64px 1fr 84px 36px;
    }
    .selected-item img, .selected-item .placeholder {
      width: 64px;
      height: 64px;
    }
    .qty {
      min-width: 0;
    }
    .icon {
      padding: 0;
      min-height: 36px;
    }
    .results {
      display: grid;
      gap: 8px;
      max-height: 420px;
      overflow: auto;
    }
    .signature {
      width: 100%;
      height: 180px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      touch-action: none;
    }
    .file-drop-zone {
      min-height: 94px;
      align-content: center;
      border: 1px dashed #aebdaf;
      border-radius: 8px;
      padding: 12px;
      background: #f8fbf8;
    }
    .file-drop-zone.dragging {
      border-color: var(--green);
      background: #eef7f0;
    }
    .actions {
      position: sticky;
      bottom: 0;
      display: grid;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      margin: 0 -12px -12px;
    }
    .status {
      padding: 9px;
      border-radius: 7px;
      background: #eef5ef;
      color: #24513c;
    }
    .status.error {
      background: #fff0ee;
      color: var(--danger);
    }
    .hidden { display: none !important; }
    .invoice-row {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .invoice-row-header {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 10px;
      align-items: center;
    }
    .invoice-row-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .invoice-row-fields label {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mall Lot Inventory Request</h1>
    <div class="muted" id="status">Loading inventory...</div>
  </header>
  <main>
    <section class="grid">
      <label>Search Item
        <input id="search" inputmode="search" autocomplete="off" placeholder="Type orange, HDPE, SKU, barcode">
      </label>
      <div class="results" id="results"></div>
    </section>

    <section class="grid">
      <label>Selected Items</label>
      <div class="grid" id="selected"></div>
    </section>

    <section class="grid">
      <label>Type
        <select id="requestType">
          <option>Borrowed</option>
          <option>Issued Permanently</option>
        </select>
      </label>
      <label>Date Borrowed / Issued<input id="requestDate" type="date" required></label>
      <label>Jobsite<input id="jobsite" placeholder="Jobsite or project"></label>
      <label>Requested By<input id="requestedBy" required placeholder="Requester name"></label>
      <label>Approved By<input id="approvedBy" placeholder="Approver name"></label>
      <label>Name<input id="signatureName" placeholder="Printed signer name"></label>
      <label>Return Date<input id="returnDate" type="date"></label>
      <label>PO #<input id="poNumber" required placeholder="PO number"></label>
      <label>Company<input id="company" placeholder="Company name"></label>
      <label class="file-drop-zone" id="poDropZone">PO Upload
        <input id="poUpload" type="file" required accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx">
        <span class="muted" id="poFileLabel">Required: click or drag PDF, JPEG/image, Word, or Excel PO here.</span>
      </label>
      <label>Request Photo
        <button type="button" id="requestCameraBtn">Use Camera</button>
        <input id="requestPhoto" type="file" accept="image/*">
        <input class="hidden" id="requestPhotoCamera" type="file" accept="image/*" capture="environment">
      </label>
      <label>Notes<textarea id="notes" placeholder="Optional details"></textarea></label>
    </section>

    <section class="grid">
      <label>Actual Signature</label>
      <canvas class="signature" id="signature"></canvas>
      <button type="button" id="clearSignature">Clear Signature</button>
    </section>

    <section class="actions">
      <button class="primary" id="submitRequest">Submit Request</button>
      <button id="reloadItems">Reload Inventory</button>
      <button id="mobileInvoiceBtn">PDF Approvals</button>
      <div class="status" id="message">Choose one or more items first.</div>
    </section>

    <section class="grid hidden" id="invoiceSection">
      <label>Pending Computer Uploads
        <select id="invoiceDraftSelect"></select>
      </label>
      <div class="actions" style="position: static; padding: 0; box-shadow: none;">
        <button id="refreshInvoiceDrafts" type="button">Refresh Pending Uploads</button>
        <button id="saveInvoiceDraft" type="button">Save Draft Photos</button>
      </div>
      <div class="muted" id="invoiceStatus">Review pending invoice items uploaded from the computer, add photos if needed, then approve into inventory.</div>
      <div class="grid" id="invoiceRows"></div>
      <button id="addInvoiceRow" type="button">Add Manual Row</button>
      <button class="primary" id="approveInvoiceRows" type="button">Approve Add To Inventory</button>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://laufwbeinkvlwdhroeaj.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhdWZ3YmVpbmt2bHdkaHJvZWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MjE0NTksImV4cCI6MjA5NDk5NzQ1OX0.Jm3ivkmxnak2j9uX1n9b1e0cVuT5QlH2U8CLHoZWKqg";
    const itemTable = "inventory_items";
    const requestTable = "inventory_requests";
    const client = createClient(supabaseUrl, supabaseKey);
    const $ = id => document.getElementById(id);
    let items = [];
    let selected = [];
    let photoData = "";
    let poFileData = "";
    let poFileName = "";
    let poFileType = "";
    let signatureData = "";
    let invoiceRows = [];
    let invoiceDrafts = [];
    let activeInvoiceDraftId = "";
    const adminPassword = "Landscape1";
    const maxPoDocumentBytes = 1200000;

    $("requestDate").value = new Date().toISOString().slice(0, 10);

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function itemText(item) {
      return [item.name, item.sku, item.barcode, item.category, item.location, item.bin, item.supplier, item.tags, stockSummary(item)].filter(Boolean).join(" ").toLowerCase();
    }

    function stockRows(item) {
      return Array.isArray(item.stockLocations) && item.stockLocations.length
        ? item.stockLocations
        : [{ id: "", location: item.location || "", bin: item.bin || "", quantity: Number(item.quantity || 0) }];
    }

    function stockSummary(item) {
      return stockRows(item).map(row => `${row.location || "No location"} ${row.bin || ""} ${Number(row.quantity || 0)} ${item.unit || ""}`).join(", ");
    }

    function normalizeStockLocations(item = {}) {
      const rows = Array.isArray(item.stockLocations) ? item.stockLocations : [];
      const cleanRows = rows.map(row => ({
        id: row.id || crypto.randomUUID(),
        location: String(row.location || "").trim(),
        bin: String(row.bin || "").trim(),
        quantity: Number(row.quantity || 0),
        notes: String(row.notes || "").trim()
      })).filter(row => row.location || row.bin || row.quantity > 0);
      if (!cleanRows.length && (item.location || item.bin || Number(item.quantity || 0) > 0)) {
        cleanRows.push({ id: crypto.randomUUID(), location: item.location || "Main", bin: item.bin || "", quantity: Number(item.quantity || 0), notes: "" });
      }
      return cleanRows;
    }

    function stockLocationTotal(item = {}) {
      return normalizeStockLocations(item).reduce((sum, row) => sum + Number(row.quantity || 0), 0);
    }

    function adjustStockLocationByName(item, locationName, binName, amount) {
      item.stockLocations = normalizeStockLocations(item);
      const cleanLocation = String(locationName || "").trim() || item.location || "Main";
      const cleanBin = String(binName || "").trim();
      let row = item.stockLocations.find(location =>
        String(location.location || "").trim().toLowerCase() === cleanLocation.toLowerCase()
        && String(location.bin || "").trim().toLowerCase() === cleanBin.toLowerCase()
      );
      if (!row) {
        row = { id: crypto.randomUUID(), location: cleanLocation, bin: cleanBin, quantity: 0, notes: "" };
        item.stockLocations.push(row);
      }
      row.quantity = Math.max(0, Number(row.quantity || 0) + Number(amount));
      item.quantity = stockLocationTotal(item);
      item.location = item.stockLocations.map(location => location.location).filter(Boolean)[0] || item.location || "";
      item.bin = item.stockLocations.map(location => location.bin).filter(Boolean)[0] || item.bin || "";
      return row;
    }

    function photoHtml(item) {
      return item.photoData
        ? `<img src="${item.photoData}" alt="${escapeHtml(item.name)} photo">`
        : `<div class="placeholder">IMG</div>`;
    }

    function setMessage(text, error = false) {
      $("message").textContent = text;
      $("message").classList.toggle("error", error);
    }

    async function loadItems() {
      $("status").textContent = "Loading inventory from Supabase...";
      const { data, error } = await client.from(itemTable).select("payload").order("name", { ascending: true });
      if (error) {
        $("status").textContent = "Could not load inventory.";
        setMessage(error.message, true);
        return;
      }
      items = (data || []).map(row => row.payload).filter(Boolean);
      $("status").textContent = `${items.length} items loaded.`;
      renderResults();
    }

    function matches() {
      const query = $("search").value.trim().toLowerCase();
      const terms = query.split(/\s+/).filter(Boolean);
      const source = terms.length ? items.filter(item => terms.every(term => itemText(item).includes(term))) : items;
      return source.slice(0, 30);
    }

    function renderResults() {
      const rows = matches();
      $("results").innerHTML = rows.map(item => `
        <button type="button" class="row" data-add="${escapeHtml(item.id)}">
          ${photoHtml(item)}
          <span>
            <strong>${escapeHtml(item.name || "Unnamed item")}</strong>
            <span class="muted">${escapeHtml([item.sku, item.category, stockSummary(item)].filter(Boolean).join(" | "))}</span>
          </span>
        </button>
      `).join("") || `<div class="row"><div class="placeholder">IMG</div><span><strong>No matching item</strong><span class="muted">Try another word like orange, HDPE, SKU, or location.</span></span></div>`;
    }

    function renderSelected() {
      $("selected").innerHTML = selected.map((line, index) => `
        <div class="row selected-item">
          ${photoHtml(line.item)}
          <span>
            <strong>${escapeHtml(line.item.name || "Unnamed item")}</strong>
            <span class="muted">${escapeHtml(line.item.unit || "unit")} | ${escapeHtml(stockSummary(line.item))}</span>
          </span>
          <input class="qty" type="number" min="1" step="1" value="${Number(line.quantity || 1)}" data-qty="${index}">
          <button class="icon danger" type="button" data-remove="${index}">-</button>
        </div>
      `).join("") || `<div class="muted">No items selected yet.</div>`;
    }

    function addItem(id) {
      const item = items.find(record => record.id === id);
      if (!item) return;
      const existing = selected.find(line => line.item.id === id);
      if (existing) existing.quantity += 1;
      else selected.push({ item, quantity: 1 });
      renderSelected();
      setMessage(`${item.name} added.`);
    }

    $("results").addEventListener("click", event => {
      const button = event.target.closest("[data-add]");
      if (button) addItem(button.dataset.add);
    });

    $("selected").addEventListener("input", event => {
      if (!event.target.matches("[data-qty]")) return;
      selected[Number(event.target.dataset.qty)].quantity = Math.max(1, Number(event.target.value || 1));
    });

    $("selected").addEventListener("click", event => {
      const button = event.target.closest("[data-remove]");
      if (!button) return;
      selected.splice(Number(button.dataset.remove), 1);
      renderSelected();
    });

    $("search").addEventListener("input", renderResults);
    $("reloadItems").addEventListener("click", loadItems);
    $("requestType").addEventListener("change", () => {
      $("returnDate").required = $("requestType").value === "Borrowed";
    });
    $("returnDate").required = true;

    $("requestPhoto").addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (!file) return;
      compressImageFile(file, data => {
        photoData = data;
      }, { maxSide: 600, quality: 0.52 });
    });

    function compressImageFile(file, onLoad, options = {}) {
      if (!file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const maxSide = options.maxSide || 900;
          const quality = options.quality || 0.68;
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          onLoad(canvas.toDataURL("image/jpeg", quality));
        };
        image.onerror = () => setMessage("Could not reduce that image. Please try another one.", true);
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function handlePoUpload(file) {
      if (!file) return;
      const allowed = ["application/pdf", "image/", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.ms-excel", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"];
      if (!allowed.some(type => file.type === type || file.type.startsWith(type))) {
        setMessage("Please upload a PDF, JPEG/image, Word, or Excel PO file.", true);
        $("poUpload").value = "";
        return;
      }
      if (file.type.startsWith("image/")) {
        compressImageFile(file, data => {
          poFileData = data;
          poFileName = file.name.replace(/\.[^.]+$/, "") + "-compressed.jpg";
          poFileType = "image/jpeg";
          $("poFileLabel").textContent = `Attached compressed image: ${poFileName}`;
          setMessage("PO image reduced and attached.");
        }, { maxSide: 1000, quality: 0.55 });
        return;
      }
      if (file.size > maxPoDocumentBytes) {
        setMessage("PO file is too large. Please upload a file under 1.2 MB, or take/upload a photo of the PO so the app can reduce it automatically.", true);
        $("poUpload").value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        poFileData = reader.result;
        poFileName = file.name;
        poFileType = file.type || "application/octet-stream";
        $("poFileLabel").textContent = `Attached: ${file.name}`;
        setMessage("PO file attached.");
      };
      reader.onerror = () => setMessage("Could not read the PO file. Please try another file.", true);
      reader.readAsDataURL(file);
    }

    $("poUpload").addEventListener("change", event => handlePoUpload(event.target.files?.[0]));

    function setupPoDropZone() {
      const zone = $("poDropZone");
      ["dragenter", "dragover"].forEach(type => zone.addEventListener(type, event => {
        event.preventDefault();
        zone.classList.add("dragging");
      }));
      ["dragleave", "drop"].forEach(type => zone.addEventListener(type, event => {
        event.preventDefault();
        zone.classList.remove("dragging");
      }));
      zone.addEventListener("drop", event => {
        const file = event.dataTransfer.files?.[0];
        if (file) handlePoUpload(file);
      });
    }

    async function openInvoiceAdmin() {
      const password = prompt("Enter Admin Password");
      if (password !== adminPassword) {
        setMessage("Incorrect admin password.", true);
        return;
      }
      location.href = "invoice-approval.html";
      return;
      $("invoiceSection").classList.remove("hidden");
      $("invoiceSection").scrollIntoView({ behavior: "smooth", block: "start" });
      await loadInvoiceDrafts();
    }

    async function loadInvoiceDrafts() {
      $("invoiceStatus").textContent = "Loading pending invoice drafts...";
      const { data, error } = await client.from(requestTable).select("payload").order("updated_at", { ascending: false });
      if (error) {
        $("invoiceStatus").textContent = error.message;
        return;
      }
      invoiceDrafts = (data || []).map(row => row.payload).filter(payload => payload?.recordType === "invoice_import" && payload.status !== "Approved");
      if (!invoiceDrafts.length) {
        activeInvoiceDraftId = "";
        invoiceRows = [];
        $("invoiceDraftSelect").innerHTML = `<option value="">No pending uploads</option>`;
        renderInvoiceRows();
        $("invoiceStatus").textContent = "No pending invoice drafts found.";
        return;
      }
      $("invoiceDraftSelect").innerHTML = invoiceDrafts.map((draft, index) => {
        const date = draft.updatedAt || draft.createdAt || "";
        const label = `Upload ${index + 1} - ${new Date(date || Date.now()).toLocaleString()} - ${(draft.rows || []).length} item${(draft.rows || []).length === 1 ? "" : "s"}`;
        return `<option value="${escapeHtml(draft.id)}">${escapeHtml(label)}</option>`;
      }).join("");
      activeInvoiceDraftId = activeInvoiceDraftId && invoiceDrafts.some(draft => draft.id === activeInvoiceDraftId) ? activeInvoiceDraftId : invoiceDrafts[0].id;
      $("invoiceDraftSelect").value = activeInvoiceDraftId;
      loadSelectedInvoiceDraft();
      $("invoiceStatus").textContent = `${invoiceDrafts.length} pending computer upload${invoiceDrafts.length === 1 ? "" : "s"} found.`;
    }

    function loadSelectedInvoiceDraft() {
      const draft = invoiceDrafts.find(record => record.id === activeInvoiceDraftId);
      if (!draft) {
        invoiceRows = [];
        renderInvoiceRows();
        return;
      }
      invoiceRows = (draft.rows || []).map(row => ({ use: row.use !== false, photoData: row.photoData || "", ...row }));
      renderInvoiceRows();
    }

    async function saveActiveInvoiceDraft(message = "Draft saved online.") {
      if (!activeInvoiceDraftId) {
        $("invoiceStatus").textContent = "No pending invoice draft selected.";
        return false;
      }
      invoiceRows = collectInvoiceRows();
      const draft = invoiceDrafts.find(record => record.id === activeInvoiceDraftId) || { id: activeInvoiceDraftId, recordType: "invoice_import" };
      draft.status = draft.status || "Pending";
      draft.rows = invoiceRows;
      draft.updatedAt = new Date().toISOString();
      const { error } = await client.from(requestTable).upsert({
        id: activeInvoiceDraftId,
        request_type: "Invoice Import",
        status: draft.status,
        item_name: "Invoice import draft",
        payload: draft,
        updated_at: draft.updatedAt
      }, { onConflict: "id" });
      if (error) {
        $("invoiceStatus").textContent = error.message;
        return false;
      }
      $("invoiceStatus").textContent = message;
      return true;
    }

    function renderInvoiceRows() {
      $("invoiceRows").innerHTML = invoiceRows.map((row, index) => `
        <div class="invoice-row" data-invoice-row="${index}">
          <div class="invoice-row-header">
            ${row.photoData ? `<img src="${row.photoData}" alt="Item photo">` : `<div class="placeholder">IMG</div>`}
            <label>Item Photo
              <button type="button" data-invoice-camera="${index}">Use Camera</button>
              <input type="file" accept="image/*" data-invoice-photo="${index}">
              <input class="hidden" type="file" accept="image/*" capture="environment" data-invoice-camera-input="${index}">
            </label>
          </div>
          <div class="invoice-row-fields">
            <label>Use<input type="checkbox" data-invoice-use ${row.use === false ? "" : "checked"}></label>
            <label>Item<input data-invoice-name value="${escapeHtml(row.name || "")}"></label>
            <label>SKU<input data-invoice-sku value="${escapeHtml(row.sku || "")}"></label>
            <label>Qty<input type="number" min="0" step="1" data-invoice-qty value="${Number(row.quantity || 1)}"></label>
            <label>Unit<input data-invoice-unit value="${escapeHtml(row.unit || "each")}"></label>
            <label>Unit Cost<input type="number" min="0" step="0.01" data-invoice-cost value="${Number(row.unitCost || 0)}"></label>
            <label>Location<input data-invoice-location value="${escapeHtml(row.location || "Mall Lot")}"></label>
            <label>Bin<input data-invoice-bin value="${escapeHtml(row.bin || "")}"></label>
          </div>
        </div>
      `).join("") || `<div class="muted">No draft rows loaded.</div>`;
    }

    function collectInvoiceRows() {
      return [...document.querySelectorAll("[data-invoice-row]")].map((row, index) => ({
        ...invoiceRows[index],
        use: row.querySelector("[data-invoice-use]").checked,
        name: row.querySelector("[data-invoice-name]").value.trim(),
        sku: row.querySelector("[data-invoice-sku]").value.trim(),
        quantity: Number(row.querySelector("[data-invoice-qty]").value || 0),
        unit: row.querySelector("[data-invoice-unit]").value.trim() || "each",
        unitCost: Number(row.querySelector("[data-invoice-cost]").value || 0),
        location: row.querySelector("[data-invoice-location]").value.trim() || "Mall Lot",
        bin: row.querySelector("[data-invoice-bin]").value.trim()
      }));
    }

    function itemRecord(item) {
      return {
        id: item.id,
        payload: item,
        sku: item.sku,
        name: item.name,
        quantity: item.quantity,
        po_number: item.poNumber,
        source_from: item.sourceFrom,
        updated_at: item.updatedAt
      };
    }

    async function approveInvoiceRows() {
      invoiceRows = collectInvoiceRows();
      const rows = invoiceRows.filter(row => row.use && row.name && Number(row.quantity || 0) > 0);
      if (!rows.length) {
        $("invoiceStatus").textContent = "No approved rows are ready.";
        return;
      }
      const changed = new Map();
      rows.forEach(row => {
        let item = items.find(record => row.sku && String(record.sku || "").toLowerCase() === row.sku.toLowerCase())
          || items.find(record => String(record.name || "").toLowerCase() === row.name.toLowerCase());
        if (!item) {
          item = {
            id: crypto.randomUUID(),
            name: row.name,
            sku: row.sku,
            barcode: "",
            category: "General",
            quantity: 0,
            unit: row.unit,
            reorderPoint: 0,
            targetStock: row.quantity,
            unitCost: row.unitCost,
            sellPrice: 0,
            location: row.location,
            bin: row.bin,
            supplier: "",
            supplierContact: "",
            poNumber: "",
            sourceFrom: "Invoice import",
            owner: "",
            status: "Active",
            photoData: row.photoData || "",
            stockLocations: [],
            movements: [],
            createdAt: new Date().toISOString()
          };
          items.unshift(item);
        }
        if (row.photoData) item.photoData = row.photoData;
        item.unit = row.unit || item.unit || "each";
        item.unitCost = row.unitCost || item.unitCost || 0;
        const locationRow = adjustStockLocationByName(item, row.location, row.bin, row.quantity);
        item.updatedAt = new Date().toISOString();
        item.movements ||= [];
        item.movements.push({ amount: row.quantity, reason: "Added from mobile approved invoice draft", location: [locationRow.location, locationRow.bin].filter(Boolean).join(" / "), date: new Date().toISOString() });
        changed.set(item.id, itemRecord(item));
      });
      $("invoiceStatus").textContent = "Saving approved items...";
      const { error } = await client.from(itemTable).upsert([...changed.values()], { onConflict: "id" });
      if (error) {
        $("invoiceStatus").textContent = error.message;
        return;
      }
      if (activeInvoiceDraftId) {
        const draft = invoiceDrafts.find(record => record.id === activeInvoiceDraftId) || { id: activeInvoiceDraftId, recordType: "invoice_import" };
        draft.status = "Approved";
        draft.rows = invoiceRows;
        draft.updatedAt = new Date().toISOString();
        await client.from(requestTable).upsert({ id: activeInvoiceDraftId, request_type: "Invoice Import", status: "Approved", item_name: "Invoice import draft", payload: draft, updated_at: draft.updatedAt }, { onConflict: "id" });
      }
      $("invoiceStatus").textContent = `Approved ${rows.length} row${rows.length === 1 ? "" : "s"} into inventory.`;
      await loadItems();
      await loadInvoiceDrafts();
    }

    function setupSignature() {
      const canvas = $("signature");
      const ctx = canvas.getContext("2d");
      let drawing = false;
      function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(rect.width * devicePixelRatio));
        canvas.height = Math.max(1, Math.round(rect.height * devicePixelRatio));
        ctx.scale(devicePixelRatio, devicePixelRatio);
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#172018";
      }
      function point(event) {
        const touch = event.touches?.[0] || event;
        const rect = canvas.getBoundingClientRect();
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
      }
      function start(event) {
        event.preventDefault();
        drawing = true;
        const p = point(event);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      }
      function draw(event) {
        if (!drawing) return;
        event.preventDefault();
        const p = point(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        signatureData = canvas.toDataURL("image/png");
      }
      function stop() {
        drawing = false;
        signatureData = canvas.toDataURL("image/png");
      }
      resize();
      addEventListener("resize", resize);
      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stop);
      canvas.addEventListener("mouseleave", stop);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", stop);
      $("clearSignature").addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        signatureData = "";
      });
    }

    async function submitRequest() {
      if (!selected.length) {
        setMessage("Choose at least one item.", true);
        return;
      }
      if (!$("requestedBy").value.trim()) {
        setMessage("Requested By is required.", true);
        return;
      }
      if ($("requestType").value === "Borrowed" && !$("returnDate").value) {
        setMessage("Return Date is required for borrowed items.", true);
        return;
      }
      if (!$("poNumber").value.trim()) {
        setMessage("PO # is required.", true);
        return;
      }
      if (!poFileData) {
        setMessage("PO upload is required. Attach the PO PDF, image, Word, or Excel file.", true);
        return;
      }
      const first = selected[0];
      const request = {
        id: crypto.randomUUID(),
        requestType: $("requestType").value,
        requestDate: $("requestDate").value,
        jobsite: $("jobsite").value.trim(),
        requestedBy: $("requestedBy").value.trim(),
        approvedBy: $("approvedBy").value.trim(),
        signatureName: $("signatureName").value.trim(),
        signatureData,
        photoData,
        poFileData,
        poFileName,
        poFileType,
        returnDate: $("returnDate").value,
        poNumber: $("poNumber").value.trim(),
        company: $("company").value.trim(),
        notes: $("notes").value.trim(),
        status: "Pending",
        itemId: first.item.id,
        itemName: first.item.name,
        sku: first.item.sku || "",
        quantity: Number(first.quantity || 1),
        unit: first.item.unit || "",
        items: selected.map(line => ({
          itemId: line.item.id,
          itemName: line.item.name,
          sku: line.item.sku || "",
          quantity: Number(line.quantity || 1),
          unit: line.item.unit || "",
          locationId: stockRows(line.item)[0]?.id || "",
          locationName: stockSummary(line.item)
        })),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      const record = {
        id: request.id,
        item_id: request.itemId,
        request_type: request.requestType,
        item_name: request.itemName,
        sku: request.sku,
        requested_by: request.requestedBy,
        jobsite: request.jobsite,
        approved_by: request.approvedBy,
        signature_name: request.signatureName,
        signature_data: request.signatureData,
        photo_data: request.photoData,
        po_file_data: request.poFileData,
        po_file_name: request.poFileName,
        po_file_type: request.poFileType,
        return_date: request.returnDate || null,
        issue_po_number: request.poNumber,
        quantity: request.quantity,
        unit: request.unit,
        company: request.company,
        status: request.status,
        items: request.items,
        payload: request,
        updated_at: request.updatedAt
      };
      setMessage("Submitting request...");
      const { error } = await client.from(requestTable).upsert(record, { onConflict: "id" });
      if (error) {
        setMessage(error.message, true);
        return;
      }
      selected = [];
      renderSelected();
      setMessage("Request submitted. Thank you.");
      document.querySelectorAll("input:not(#search), textarea").forEach(input => input.value = "");
      $("requestDate").value = new Date().toISOString().slice(0, 10);
      photoData = "";
      poFileData = "";
      poFileName = "";
      poFileType = "";
      $("poFileLabel").textContent = "Required: click or drag PDF, JPEG/image, Word, or Excel PO here.";
      signatureData = "";
      $("clearSignature").click();
    }

    $("submitRequest").addEventListener("click", submitRequest);
    $("requestCameraBtn").addEventListener("click", () => $("requestPhotoCamera").click());
    $("requestPhotoCamera").addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (!file) return;
      compressImageFile(file, data => {
        photoData = data;
      }, { maxSide: 600, quality: 0.52 });
    });
    $("mobileInvoiceBtn").addEventListener("click", openInvoiceAdmin);
    $("refreshInvoiceDrafts").addEventListener("click", loadInvoiceDrafts);
    $("saveInvoiceDraft").addEventListener("click", () => saveActiveInvoiceDraft());
    $("invoiceDraftSelect").addEventListener("change", event => {
      activeInvoiceDraftId = event.target.value;
      loadSelectedInvoiceDraft();
      $("invoiceStatus").textContent = "Pending computer upload loaded.";
    });
    $("addInvoiceRow").addEventListener("click", () => {
      invoiceRows = collectInvoiceRows();
      invoiceRows.push({ use: true, name: "", sku: "", quantity: 1, unit: "each", unitCost: 0, location: "Mall Lot", bin: "", photoData: "" });
      renderInvoiceRows();
    });
    $("approveInvoiceRows").addEventListener("click", approveInvoiceRows);
    $("invoiceRows").addEventListener("change", event => {
      const input = event.target.closest("[data-invoice-photo], [data-invoice-camera-input]");
      if (!input?.files?.[0]) return;
      const index = Number(input.dataset.invoicePhoto ?? input.dataset.invoiceCameraInput);
      invoiceRows = collectInvoiceRows();
      compressImageFile(input.files[0], data => {
        invoiceRows[index].photoData = data;
        renderInvoiceRows();
        saveActiveInvoiceDraft("Photo attached and saved online.");
      }, { maxSide: 700, quality: 0.55 });
    });
    $("invoiceRows").addEventListener("click", event => {
      const button = event.target.closest("[data-invoice-camera]");
      if (!button) return;
      const input = document.querySelector(`[data-invoice-camera-input="${button.dataset.invoiceCamera}"]`);
      input?.click();
    });
    setupPoDropZone();
    setupSignature();
    renderSelected();
    loadItems();
  </script>
</body>
</html>
